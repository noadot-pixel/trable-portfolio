<script>
    function escapeMenuText(text) {

        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    (async function renderMemberMenu() {

        const memberMenu =
            document.getElementById("memberMenu");

        const currentUser =
            mockAuth.getCurrentUser();

        if (!memberMenu || !currentUser) {
            return;
        }

        /*
         * 로그인 정보의 닉네임은 이 브라우저(localStorage)에만 저장돼 있어서,
         * 다른 곳에서 닉네임을 바꿨다면 users 문서의 최신 닉네임으로 맞춘다.
         */

        try {

            const profileDoc = await firebase.firestore()
                .collection("users").doc(currentUser.id).get();

            const savedNickname =
                profileDoc.exists ? profileDoc.data().nickname : "";

            if (savedNickname && savedNickname !== currentUser.nickname) {
                currentUser.nickname = savedNickname;
                mockAuth.login(currentUser);
            }

        } catch (error) {
            console.warn("닉네임을 동기화하지 못했습니다(무시):", error.code || error.message);
        }

        const isAdmin =
            await mockAuth.isAdmin();

        const adminLinkHtml = isAdmin
            ? '<a href="../admin/index.html">관리자</a>'
            : '';

        memberMenu.innerHTML =
            adminLinkHtml
            + '<a href="../mypage.html">마이페이지</a>'
            + '<span class="member-nickname">'
            + escapeMenuText(currentUser.nickname)
            + '님</span>'
            + '<a href="#" id="logoutLink">로그아웃</a>';

        document.getElementById("logoutLink")
            .addEventListener("click", function (event) {

                event.preventDefault();

                mockAuth.logout();

                location.reload();

            });

    })();
</script>

<script>
    /*
     * 이미 로그인되어 있으면 메인으로 바로 이동
     * (mockAuth는 화면 표시용 로그인 상태만 관리한다)
     */

    if (mockAuth.isLoggedIn()) {
        location.href = "../index.html";
    }
</script>

<script>
    /*
     * Firebase Authentication(이메일/비밀번호)으로 실제 계정을 검증한다.
     * Firebase 콘솔의 Authentication > Users에 미리 등록된 계정만 로그인 가능.
     * 로그인에 성공하면 화면 표시용 mockAuth(localStorage)에도 반영한다.
     */

    const loginForm =
        document.getElementById("loginForm");

    const loginEmailInput =
        document.getElementById("loginEmail");

    const loginPasswordInput =
        document.getElementById("loginPassword");

    const LOGIN_ERROR_MESSAGES = {
        "auth/invalid-email": "이메일 형식이 올바르지 않습니다.",
        "auth/user-not-found": "등록되지 않은 계정입니다.",
        "auth/wrong-password": "비밀번호가 올바르지 않습니다.",
        "auth/invalid-credential": "이메일 또는 비밀번호가 올바르지 않습니다.",
        "auth/too-many-requests": "로그인 시도가 너무 많습니다. 잠시 후 다시 시도해 주세요."
    };

    loginForm.addEventListener("submit", function (event) {

        event.preventDefault();

        const loginEmail =
            loginEmailInput.value.trim();

        const loginPassword =
            loginPasswordInput.value.trim();

        if (loginEmail === "" || loginPassword === "") {

            alert("이메일과 비밀번호를 입력해 주세요.");

            return;
        }

        firebase.auth().signInWithEmailAndPassword(loginEmail, loginPassword)
            .then(function (userCredential) {

                const firebaseUser = userCredential.user;

                mockAuth.login({
                    id: firebaseUser.uid,
                    email: firebaseUser.email,
                    nickname: firebaseUser.displayName || firebaseUser.email.split("@")[0]
                });

                location.href = "../index.html";

            })
            .catch(function (error) {

                const message =
                    LOGIN_ERROR_MESSAGES[error.code]
                    || "로그인에 실패했습니다. 잠시 후 다시 시도해 주세요.";

                alert(message);

            });

    });
</script>
